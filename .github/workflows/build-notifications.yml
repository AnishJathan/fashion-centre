name: Notify contributors of builds
on:
  workflow_run:
    workflows: [Verify Fashion Centre]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed verification run to announce
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  notify:
    if: github.repository == 'AnishJathan/fashion-centre' && (github.event_name == 'workflow_run' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Share downloads with repository contributors
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 scripts/notify-build.py
