name: Verify local demo
on:
  pull_request:
  push:
    branches: [main, feature/shopify-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: npm test
      - name: Backend contract and adversarial tests
        working-directory: backend
        run: mvn -B --no-transfer-progress package
      - name: Install isolated CI browser
        run: npx playwright install --with-deps chromium
      - name: Browser regressions and local API readiness
        run: npm run test:ui
        env:
          CI: 'true'
