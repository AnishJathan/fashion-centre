name: Email contributor builds
on:
  workflow_run:
    workflows: [Verify Fashion Centre]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  email:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only run the notification code from the trusted default branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Email build downloads and outcome
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MAIL_RECIPIENTS: ${{ secrets.BUILD_MAIL_RECIPIENTS }}
          BUILD_MAIL_PASSWORD: ${{ secrets.BUILD_MAIL_PASSWORD }}
        run: python3 scripts/email-build.py
