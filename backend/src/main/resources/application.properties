spring.config.import=optional:file:./secrets.properties
spring.application.name=fashion-centre-demo
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/fashion_centre?serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=fashion
spring.datasource.password=${DB_PASSWORD:fashion}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

pruna.api.key=${PRUNA_API_KEY}

auth.code-pepper=${AUTH_CODE_PEPPER}
auth.expose-dev-code=${AUTH_EXPOSE_DEV_CODE:false}

r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket=${R2_BUCKET}

server.error.include-message=always
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none

google.client-ids=${GOOGLE_WEB_CLIENT_ID},${GOOGLE_IOS_CLIENT_ID}
social.apple.audience=com.fashioncentre.app

auth.google.web-client-id=${GOOGLE_WEB_CLIENT_ID}
auth.apple.bundle-id=${APPLE_BUNDLE_ID}
auth.google.ios-client-id=${GOOGLE_IOS_CLIENT_ID}
